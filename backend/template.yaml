AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Qlue AI-powered voice interview simulation mobile app.

Parameters:
  EmailOtpDailyLimit:
    Type: Number
    Default: 40
    MinValue: 1
    MaxValue: 50
    Description: Global verification-email attempt cap; resets at 09:00 UTC.
  PaidAttemptDailyLimit:
    Type: Number
    Default: 50
    MinValue: 0
    Description: Maximum global provider attempts per UTC day; includes failures and retries.
  # Finding 13 (operational readiness): where operational alerts are delivered.
  # Left empty by default so the stack still deploys without it, but with no
  # address NO alarm or budget alert reaches a human — pass a real mailbox at
  # deploy time (sam deploy --parameter-overrides OperatorEmail=ops@example.com)
  # and confirm the SNS subscription email before relying on alerting.
  OperatorEmail:
    Type: String
    Default: ""
    Description: "Email address that receives CloudWatch alarm and budget alerts. Empty disables delivery."
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    Description: "Monthly cost budget (USD). Alerts at 80% actual and 100% forecast when OperatorEmail is set."

Conditions:
  # Only wire the email subscription / budget when an operator address is given;
  # an empty address would otherwise fail resource creation.
  HasOperatorEmail: !Not [!Equals [!Ref OperatorEmail, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Layers:
      - !Ref QlueSharedLayer
      - !Ref AppDependenciesLayer

    Environment:
      Variables:
        # Firebase Admin 14 requires loading its ESM JWT dependency from CJS.
        # Lambda disables this Node 24 feature unless explicitly enabled.
        NODE_OPTIONS: '--experimental-require-module'
        USERS_TABLE: !Ref UsersTable
        RESUMES_TABLE: !Ref ResumesTable
        SESSIONS_TABLE: !Ref SessionsTable
        TRANSCRIPTS_TABLE: !Ref TranscriptsTable
        FEEDBACK_TABLE: !Ref FeedbackTable
        CONCEPT_STATES_TABLE: !Ref ConceptStatesTable
        WS_CONNECTIONS_TABLE: !Ref WSConnectionsTable
        NOTIFICATIONS_TABLE: !Ref NotificationsTable
        USAGE_TABLE: !Ref UsageTable
        SUPPORT_TABLE: !Ref SupportTable
        DELETION_JOBS_TABLE: !Ref DeletionJobsTable
        ANALYSIS_JOBS_TABLE: !Ref AnalysisJobsTable
        PAID_OPS_SWITCH_PARAMETER: !Ref PaidOpsSwitch
        PAID_ATTEMPT_LIMIT: !Ref PaidAttemptDailyLimit
        QLUE_PAID_OPS_DISABLED: ''
        # In-app Help & Support destination. Email delivery is DEPLOY-GATED: it
        # only fires once this address is a verified SES identity (see
        # SubmitSupportFunction). Tickets are stored in SupportTable regardless.
        SUPPORT_EMAIL: 'developersqlue@gmail.com'
        RESUMES_BUCKET: !Ref ResumesBucket
        SCRAPED_CONTENT_BUCKET: !Ref ScrapedContentBucket
        AUDIO_BUCKET: !Ref AudioBucket
        # Derive the name to avoid an S3 notification/function dependency cycle.
        ANSWER_AUDIO_BUCKET: !Sub '${AWS::StackName}-answers-${AWS::AccountId}-${AWS::Region}'
        FEEDBACK_TOPIC_ARN: !Ref FeedbackTriggerTopic
        WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
        BEDROCK_MODEL_ID: 'nvidia.nemotron-super-3-120b'
        ALLOWED_VOICES: "Tiffany,Ruth,Joanna,Matthew,Stephen"
        # COST-FIX: neural is $16/1M chars with 1M chars/month free (12 mo);
        # generative is $30/1M with only 100K free. Set POLLY_ALLOW_GENERATIVE
        # to 'true' to permit generative voices (e.g. Tiffany) at extra cost.
        POLLY_DEFAULT_ENGINE: 'generative'
        POLLY_ALLOW_GENERATIVE: 'true'  # user preference: natural generative voices (funded by credits)

Resources:
  PaidOpsSwitch:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/qlue/${AWS::StackName}/paid-ops-disabled'
      Type: String
      Value: 'none'
      Description: Runtime stop switch; all or comma-separated action names; Lambdas cache for 15 seconds.
  EmailOtpPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-email-verification'
      UserPoolTier: LITE
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      MfaConfiguration: 'OFF'
      EmailConfiguration: { EmailSendingAccount: COGNITO_DEFAULT }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: admin_only, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 32
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'Your Qlue verification code'
        EmailMessage: 'Your Qlue verification code is {####}. Enter it in the app within 5 minutes. Do not share this code.'
  EmailOtpClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref EmailOtpPool
      ClientName: qlue-server-email-verification
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
  EmailOtpTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
  DeletionJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions: [{ AttributeName: userId, AttributeType: S }]
      KeySchema: [{ AttributeName: userId, KeyType: HASH }]
  AnalysisJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions: [{ AttributeName: jobId, AttributeType: S }]
      KeySchema: [{ AttributeName: jobId, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
  # ==============================================================================
  # DYNAMODB TABLES
  # ==============================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable user data. Retain on stack delete/replace and enable
    # deletion protection so an accidental teardown or table replacement can
    # never drop production data. (Blocks `sam delete` until manually disabled.)
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-users
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  ResumesTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable data — retain + deletion protection.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TableName: qlue-resumes
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: resumeId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: uploadedAt
          AttributeType: N
      KeySchema:
        - AttributeName: resumeId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserIdUploadedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: uploadedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SessionsTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable data — retain + deletion protection.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TableName: qlue-sessions
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      # TTL backstop: only the per-user active-session LOCK# items carry
      # expiresAt, so this reclaims an orphaned lock if explicit release ever
      # fails. Real session rows have no expiresAt and are never TTL-deleted.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: startedAt
          AttributeType: N
        - AttributeName: activeMarker
          AttributeType: S
        # R-05 feedback outbox: sparse index keys. These attributes exist ONLY
        # while a feedback job is PENDING (removed on TERMINATED/ERROR or when a
        # job is parked FAILED), so FeedbackDispatchIndex stays tiny and the
        # scheduled dispatcher queries it rather than scanning the table.
        - AttributeName: feedbackDispatchPending
          AttributeType: S
        - AttributeName: feedbackJobUpdatedAt
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserActiveIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: activeMarker
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_UserIdStartedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: startedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # R-05: sparse index of still-PENDING feedback jobs. Partition key is the
        # constant marker (the pending set is tiny/transient; sharding is the
        # documented scale-up path), sort key is the last-update time so the
        # dispatcher can skip jobs inside the grace window and advance a cursor.
        - IndexName: FeedbackDispatchIndex
          KeySchema:
            - AttributeName: feedbackDispatchPending
              KeyType: HASH
            - AttributeName: feedbackJobUpdatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TranscriptsTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable data — retain + deletion protection.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-transcripts
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: transcriptId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: turnIndex
          AttributeType: N
      KeySchema:
        - AttributeName: transcriptId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_SessionIdTurnIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: turnIndex
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable data — retain + deletion protection.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-feedback
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: feedbackId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: generatedAt
          AttributeType: N
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      KeySchema:
        - AttributeName: feedbackId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_SessionId
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_UserIdGeneratedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: generatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ConceptStatesTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable data — retain + deletion protection.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-concept-states
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: conceptId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: concept
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: websiteUrl
          AttributeType: S
      KeySchema:
        - AttributeName: conceptId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_SessionIdConcept
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: concept
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_UserIdWebsiteUrl
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: websiteUrl
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  WSConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qlue-ws-connections
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: isActive
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserIdIsActive
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: isActive
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: durable data — retain + deletion protection.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-notifications
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: notificationId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sentAt
          AttributeType: N
      KeySchema:
        - AttributeName: notificationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserIdSentAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: sentAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Per-user daily usage counters for quota enforcement (free tier = 10
  # interviews/day, tier-derived in lib/quota.js). PK userId, SK date
  # (UTC YYYY-MM-DD); one numeric attribute per action (e.g. `interview`).
  # expiresAt (epoch seconds) TTL self-deletes stale day rows.
  UsageTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: quota counters back billing/abuse decisions — retain them so a
    # teardown can't reset every user's daily usage. Deletion protection on too.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-usage
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  SupportTable:
    Type: AWS::DynamoDB::Table
    # Finding 13: user-submitted support tickets are durable records (and the
    # source of truth behind the best-effort dev-inbox email) — retain them on
    # teardown and protect against accidental deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: qlue-support
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  # ==============================================================================
  # S3 BUCKETS
  # ==============================================================================
  ResumesBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAbandonedUploads
            Status: Enabled
            TagFilters:
              - { Key: qlue-upload, Value: staging }
            ExpirationInDays: 1
          - Id: ExpireOverwrittenUploads
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['POST']
            AllowedOrigins: ['*']

  ScrapedContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAbandonedUploads
            Status: Enabled
            TagFilters:
              - { Key: qlue-upload, Value: staging }
            ExpirationInDays: 1
          - Id: ExpireOverwrittenUploads
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: AutoDelete
            Status: Enabled
            ExpirationInDays: 30
      # Presigned-PUT uploads of JD PDFs go directly to this bucket from the
      # client, so the web build needs a CORS allowance (mirrors ResumesBucket).
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['POST']
            AllowedOrigins: ['*']

  AnswerAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-answers-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryAnswers
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  AnswerAudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AnswerAudioBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AnswerAudioBucket.Arn, !Sub '${AnswerAudioBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
  AnswerAudioFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/interview/answerAudio.handler
      CodeUri: src/
      MemorySize: 512
      Timeout: 60
      # SAM prepends the two global layers; append this isolated runtime once.
      Layers: [!Ref DeliveryRuntimeLayer]
      Environment:
        Variables:
          DELIVERY_VAD_MODEL: /opt/delivery/models/silero_vad.onnx
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - S3CrudPolicy: { BucketName: !Sub '${AWS::StackName}-answers-${AWS::AccountId}-${AWS::Region}' }
      Events:
        Uploaded:
          Type: S3
          Properties:
            Bucket: !Ref AnswerAudioBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: 'answers/' }]
  AnswerAudioFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AnswerAudioFunction}'
      RetentionInDays: 30

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      # COST-FIX: versioning suspended (turn audio is throwaway; old versions
      # accumulated storage forever) and lifecycle rules added so synthesized
      # audio self-deletes after 1 day and failed uploads don't linger.
      VersioningConfiguration:
        Status: Suspended
      # NOTE: a single LifecycleConfiguration only — CloudFormation rejects a
      # duplicate property. Turn audio (audio/ prefix) is throwaway and expires
      # in 1 day; a broader 7-day catch-all sweeps anything else, and
      # incomplete multipart uploads are aborted after 1 day.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTurnAudio
            Status: Enabled
            Prefix: audio/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: AutoDeleteAudio
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ==============================================================================
  # API GATEWAYS
  # ==============================================================================
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      BinaryMediaTypes:
        - "application/octet-stream"
        - "audio/pcm"
        - "multipart/form-data"
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'"
        AllowOrigin: "'*'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'"
              Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
      Auth:
        DefaultAuthorizer: FirebaseAuthorizer
        Authorizers:
          FirebaseAuthorizer:
            FunctionPayloadType: TOKEN
            FunctionArn: !GetAtt ValidateTokenFunction.Arn
            Identity:
              Header: Authorization
            AuthorizerResultTtlInSeconds: 0

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: QlueWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.type"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      ApiId: !Ref WebSocketApi

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Join ['/', ['integrations', !Ref ConnectIntegration]]
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Join ['/', ['integrations', !Ref DisconnectIntegration]]
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Join ['/', ['integrations', !Ref DefaultIntegration]]

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectHandlerFunction.Arn}/invocations
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
