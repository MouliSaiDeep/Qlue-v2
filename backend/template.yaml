  # ==============================================================================
  # SNS TOPICS
  # ==============================================================================
  FeedbackTriggerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: qlue-feedback-trigger

  # Finding 13: a DEDICATED operational-alert topic, separate from
  # FeedbackTriggerTopic. Alarms previously published to FeedbackTriggerTopic —
  # which is subscribed by the feedback-generation Lambda — so a DynamoDB-throttle
  # or 5xx alarm would have INVOKED the feedback pipeline with an alarm payload
  # instead of paging anyone. All alarms now target this topic, and the operator
  # email (when supplied) is the only subscriber.
  OpsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: qlue-ops-alerts

  OpsAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasOperatorEmail
    Properties:
      TopicArn: !Ref OpsAlertTopic
      Protocol: email
      Endpoint: !Ref OperatorEmail

  # ==============================================================================
  # RUNTIME CONFIGURATION
  # COST-FIX: Secrets Manager resources removed ($0.40/secret/month while
  # idle). Configuration now lives in SSM Parameter Store standard-tier
  # SecureString parameters under /qlue/*, created once out-of-band via
  # scripts/migrate-secrets-to-ssm.sh (CloudFormation cannot create
  # SecureString parameters, and String parameters would expose values in
  # the template).
  # ==============================================================================

  # ==============================================================================
  # LAMBDA FUNCTIONS
  # ==============================================================================

  # ========= AUTH =========
  ValidateTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/validateToken.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  RegisterUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/registerUser.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          EMAIL_OTP_TABLE: !Ref EmailOtpTable
          EMAIL_OTP_POOL_ID: !Ref EmailOtpPool
          EMAIL_OTP_CLIENT_ID: !Ref EmailOtpClient
          EMAIL_OTP_DAILY_LIMIT: !Ref EmailOtpDailyLimit
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post
            RestApiId: !Ref RestApi
            # Public route: callers have no Firebase token yet, so it must
            # override the API's DefaultAuthorizer (FirebaseAuthorizer) or every
            # sign-up request is rejected with 401 before the handler runs.
            Auth:
              Authorizer: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['cognito-idp:DescribeUserPoolClient']
              Resource: !GetAtt EmailOtpPool.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  SendEmailOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/emailOtp.send
      CodeUri: src/
      MemorySize: 256
      Timeout: 25
      Environment:
        Variables:
          EMAIL_OTP_TABLE: !Ref EmailOtpTable
          EMAIL_OTP_POOL_ID: !Ref EmailOtpPool
          EMAIL_OTP_CLIENT_ID: !Ref EmailOtpClient
          EMAIL_OTP_DAILY_LIMIT: !Ref EmailOtpDailyLimit
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/send-otp
            Method: post
            RestApiId: !Ref RestApi
            # Valid unverified Firebase tokens are checked inside these endpoints.
            Auth: { Authorizer: NONE }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref EmailOtpTable }
        - DynamoDBReadPolicy: { TableName: !Ref DeletionJobsTable }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
        - Statement:
            - Effect: Allow
              Action: ['cognito-idp:DescribeUserPoolClient', 'cognito-idp:AdminDeleteUser']
              Resource: !GetAtt EmailOtpPool.Arn
  SendEmailOtpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SendEmailOtpFunction}'
      RetentionInDays: 30

  VerifyEmailOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/emailOtp.verify
      CodeUri: src/
      MemorySize: 256
      Timeout: 25
      Environment:
        Variables:
          EMAIL_OTP_TABLE: !Ref EmailOtpTable
          EMAIL_OTP_POOL_ID: !Ref EmailOtpPool
          EMAIL_OTP_CLIENT_ID: !Ref EmailOtpClient
          EMAIL_OTP_DAILY_LIMIT: !Ref EmailOtpDailyLimit
      Events:
        Api:
