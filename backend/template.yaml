  ProcessResumeUploadFunction:
    # Parsing promotes uploaded bytes into an immutable private object.
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/resume/processResumeUpload.handler
      CodeUri: src/
      MemorySize: 1024
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /resume/process
            Method: post
            RestApiId: !Ref RestApi
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['s3:GetObjectVersion']
              Resource: !Sub '${ResumesBucket.Arn}/*'
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['ssm:GetParameter']
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref ResumesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref ResumesBucket
        - Statement:
            - Effect: Allow
              Action: ['s3:PutObjectTagging']
              Resource: !Sub '${ResumesBucket.Arn}/resumes/*'
        - Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
                - textract:StartDocumentAnalysis
                - textract:GetDocumentAnalysis
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
        - Statement:

            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ProcessResumeUploadFunction-*"

