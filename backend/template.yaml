              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref AnalysisJobsTable }
        - LambdaInvokePolicy: { FunctionName: !Ref AnalysisWorkerFunction }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - S3CrudPolicy: { BucketName: !Ref ScrapedContentBucket }
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel'], Resource: '*' }]
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  # ==============================================================================
  # CLOUDWATCH ALARMS
  # ==============================================================================
  # Finding 13: every alarm now routes to the dedicated OpsAlertTopic (not the
  # feedback-generation topic) so a firing alarm pages the operator instead of
  # silently invoking the feedback pipeline — and alarms that previously had no
  # AlarmActions at all now notify someone.
  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "High Lambda Error Rate"
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic
      OKActions:
        - !Ref OpsAlertTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda invocations are being throttled (concurrency limit)"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  DynamoDBThrottledRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "DynamoDB Throttling detected"
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  APIGateway5xxErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "API Gateway 5XX errors"
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  APIGatewayLatencyP99Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "API Gateway p99 latency > 5s"
      Namespace: AWS/ApiGateway
      MetricName: Latency
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  WebSocketConnectionDropRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "API GW Websocket connection drops"
      Namespace: AWS/ApiGateway
      MetricName: ConnectError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  BedrockInvocationLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Bedrock Invocation Latency > 30s"
      Namespace: AWS/Bedrock
      MetricName: InvocationLatency
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  PollySynthesisFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Polly Synthesis Errors"
      Namespace: AWS/Polly
      MetricName: 5XXError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  # Finding 9 + 13: the dead-letter queues MUST be watched — a message landing
  # here is feedback/interview work that exhausted its retries. Any depth > 0 is
  # a durable failure an operator has to drain, so page immediately.
  FeedbackDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Feedback pipeline dead-letter queue has messages (exhausted retries)"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FeedbackDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic
      OKActions:
        - !Ref OpsAlertTopic

  AsyncInterviewDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Async interview dead-letter queue has messages (exhausted retries)"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AsyncInterviewDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic
      OKActions:
        - !Ref OpsAlertTopic

  AsyncInterviewQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Async interview queue backlog: oldest message > 2min (worker stalled)"
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AsyncInterviewQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 120
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  # Finding 13: cost guardrail for a free public launch. Alerts the operator at
  # 80% of actual spend and when spend is FORECAST to exceed the budget, so a
  # runaway (e.g. Bedrock/Polly abuse) is caught before the bill lands. Only
  # created when an operator email is supplied.
  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasOperatorEmail
    Properties:
      Budget:
        BudgetName: qlue-monthly-cost
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref OperatorEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref OperatorEmail

  DeletionWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DeletionWorkerDLQ.Arn
      Environment:
        Variables:
          EMAIL_OTP_TABLE: !Ref EmailOtpTable
          EMAIL_OTP_POOL_ID: !Ref EmailOtpPool
          RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
      Handler: handlers/auth/deletionWorker.handler
      CodeUri: src/
      MemorySize: 512
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['cognito-idp:AdminDeleteUser']
              Resource: !GetAtt EmailOtpPool.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref EmailOtpTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt DeletionWorkerDLQ.QueueName }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:DescribeStream]
              Resource: !GetAtt DeletionJobsTable.StreamArn
            - Effect: Allow
              Action: [dynamodb:ListStreams]
              Resource: '*'
        - S3CrudPolicy: { BucketName: !Ref AnswerAudioBucket }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref DeletionJobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResumesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConceptStatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SupportTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DeletionJobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AnalysisJobsTable }
        - S3CrudPolicy: { BucketName: !Ref ResumesBucket }
        - S3CrudPolicy: { BucketName: !Ref ScrapedContentBucket }
        - S3CrudPolicy: { BucketName: !Ref AudioBucket }
        - Statement:
            - Effect: Allow
              Action: ['s3:ListBucketVersions']
              Resource: [!GetAtt AnswerAudioBucket.Arn, !GetAtt ResumesBucket.Arn, !GetAtt ScrapedContentBucket.Arn, !GetAtt AudioBucket.Arn]
            - Effect: Allow
              Action: ['s3:DeleteObjectVersion']
              Resource: [!Sub '${AnswerAudioBucket.Arn}/*', !Sub '${ResumesBucket.Arn}/*', !Sub '${ScrapedContentBucket.Arn}/*', !Sub '${AudioBucket.Arn}/*']
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
      Events:
        StreamTrigger:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt DeletionJobsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
                - Pattern: '{"eventName":["MODIFY"],"dynamodb":{"NewImage":{"status":{"S":["PENDING"]}}}}'
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt DeletionWorkerDLQ.Arn
  RecoverTurnsFunction:
    Type: AWS::Serverless::Function
