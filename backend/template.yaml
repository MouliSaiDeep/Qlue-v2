  # R-06: on-demand regeneration of a FAILED/unavailable feedback report. Clears
  # the stale deterministic report slot and re-publishes the feedback job to the
  # same SNS pipeline terminate uses, so a failed analysis can later become a real
  # completed report.
  RegenerateFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/feedback/regenerateFeedback.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          FEEDBACK_TOPIC_ARN: !Ref FeedbackTriggerTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['ssm:GetParameter']
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt FeedbackTriggerTopic.TopicName }

  # ==============================================================================
  # ASYNC INTERVIEW ARCHITECTURE (SQS -> WORKER -> WEBSOCKET)
  # ==============================================================================
  # This pattern handles long-running AI generations asynchronously to avoid
  # API Gateway 29s timeouts and keep the WebSocket connection responsive.

  AsyncInterviewDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # Finding 9: the async feedback pipeline (SNS trigger + 4 chained async
  # Lambdas invoked with InvocationType 'Event') previously had NO dead-letter
  # path — a stage that exhausted its async retries dropped the feedback
  # silently. Every stage now dead-letters here, so an exhausted failure is
  # durable and alarmable (operators alarm on FeedbackDLQ depth) instead of a
  # user staring at a report that never arrives.
  FeedbackDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # Delayed checks are emitted only for durable, unfinished jobs. The primary
  # interview queue retains its single existing worker.
  AnalysisWorkerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  DeletionWorkerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  ResumeRecoveryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  TurnRecoveryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  RecoveryDispatchDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  RecoveryDelayQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RecoveryDispatchDLQ.Arn
        maxReceiveCount: 5

  RecoveryDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/recovery/dispatchRecovery.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
          ANALYSIS_TARGET: !Ref AnalysisWorkerFunction
          DELETION_TARGET: !Ref DeletionWorkerFunction
          DISPATCH_TARGET: !Ref DispatchFeedbackJobsFunction
          FEEDBACK_TARGET: !Ref RecoverFeedbackFunction
          RESUME_TARGET: !Ref RecoverResumesFunction
          TURN_TARGET: !Ref RecoverTurnsFunction
      Events:
        QueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RecoveryDelayQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - SQSPollerPolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - LambdaInvokePolicy: { FunctionName: !Ref AnalysisWorkerFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref DeletionWorkerFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref DispatchFeedbackJobsFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref RecoverFeedbackFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref RecoverResumesFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref RecoverTurnsFunction }

  RecoveryDispatcherFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RecoveryDispatcherFunction}'
      RetentionInDays: 30

  AsyncInterviewQueue:
    Type: AWS::SQS::Queue
    Metadata:
      Description: "Primary buffer for interview turns. Handlers push messages here; Worker consumes them."
    Properties:
      VisibilityTimeout: 180 # 3 minutes for real-time interview retry
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AsyncInterviewDLQ.Arn
        maxReceiveCount: 3

  AsyncInterviewWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Description: "The 'Brain' of the async flow. Consumes SQS, calls Bedrock/Polly, and streams results back via WebSocket."
    Properties:
      Handler: handlers/interview/asyncWorker.handler
      CodeUri: src/
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          FEEDBACK_TOPIC_ARN: !Ref FeedbackTriggerTopic
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AsyncInterviewQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['ssm:GetParameter']
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConceptStatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResumesTable }
        - Statement: [{ Effect: Allow, Action: ['execute-api:ManageConnections'], Resource: '*' }]
        - Statement: [{ Effect: Allow, Action: ['polly:SynthesizeSpeech'], Resource: '*' }]
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream'], Resource: '*' }]
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt FeedbackTriggerTopic.TopicName }
        - S3CrudPolicy: { BucketName: !Ref ScrapedContentBucket }
        - S3CrudPolicy: { BucketName: !Ref AudioBucket }


  # ========= WEBSOCKET =========
  ConnectHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/websocket/connectHandler.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
        - Statement: [{ Effect: Allow, Action: ['execute-api:ManageConnections'], Resource: '*' }]


  DisconnectHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/websocket/disconnectHandler.handler
      CodeUri: src/
