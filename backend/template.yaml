  # ========= INTERVIEW =========
  InitializeSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/interview/initializeSession.handler
      CodeUri: src/
      # WEBSITE module fallback path may scrape (tiered), but the scraper now
      # enforces ONE total ~25s deadline across all tiers (finding 10), so the
      # whole init stays inside API Gateway's 29s integration timeout. Capping
      # the Lambda at 29s too means it can't keep doing paid work after the
      # gateway has already returned 504 to the client. Cached path returns in ms.
      MemorySize: 512
      Timeout: 29
      Events:
        Api:
          Type: Api
          Properties:
            Path: /interview/init
            Method: post
            RestApiId: !Ref RestApi
      Policies:
        - Statement:
            - Effect: Allow
