  AnalysisWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt AnalysisWorkerDLQ.Arn
      FunctionName: !Sub '${AWS::StackName}-analysis-worker'
      Handler: handlers/jd/analysisWorker.handler
      CodeUri: src/
      Environment:
        Variables:
          RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
          ANALYSIS_WORKER_LAMBDA: !Sub '${AWS::StackName}-analysis-worker'
      MemorySize: 512
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['s3:GetObjectVersion']
              Resource: !Sub '${ScrapedContentBucket.Arn}/*'
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt AnalysisWorkerDLQ.QueueName }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:DescribeStream]
              Resource: !GetAtt AnalysisJobsTable.StreamArn
            - Effect: Allow
              Action: [dynamodb:ListStreams]
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref AnalysisJobsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ResumesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - S3ReadPolicy: { BucketName: !Ref ScrapedContentBucket }
        - LambdaInvokePolicy: { FunctionName: !Sub '${AWS::StackName}-analysis-worker' }
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel', 'textract:StartDocumentTextDetection', 'textract:GetDocumentTextDetection'], Resource: '*' }]
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
      Events:
        StreamTrigger:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AnalysisJobsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
                - Pattern: '{"eventName":["MODIFY"],"dynamodb":{"NewImage":{"status":{"S":["PENDING","RUNNING","FAILED"]}}}}'
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt AnalysisWorkerDLQ.Arn
