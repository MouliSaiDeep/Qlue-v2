              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref SupportTable }
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
        # DEPLOY-GATED email: harmless until SUPPORT_EMAIL is a verified SES
        # identity. The handler stores every ticket regardless and treats a
        # failed/again-skipped send as non-fatal.
        - Statement: [{ Effect: Allow, Action: ['ses:SendEmail', 'ses:SendRawEmail'], Resource: '*' }]

