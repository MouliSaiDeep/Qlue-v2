      Handler: handlers/interview/recoverTurns.handler
      CodeUri: src/
      MemorySize: 512
      Timeout: 60
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt TurnRecoveryDLQ.QueueName }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt AsyncInterviewQueue.QueueName }
