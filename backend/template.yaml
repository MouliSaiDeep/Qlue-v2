  # ========= SCRAPER =========
  FetchAndCleanContentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/scraper/fetchAndCleanContent.handler
      CodeUri: src/
      MemorySize: 512
      # API Gateway's REST integration timeout is ~29s and is NOT raised by
      # raising the Lambda timeout (finding 10). The scraper enforces one total
      # deadline across its tiers, so cap this handler at 29s to match the
      # gateway rather than leaving it to spend credits on a request the client
      # can no longer receive.
      Timeout: 29
      Events:
        Api:
          Type: Api
          Properties:
            Path: /scraper/fetch
            Method: post
            RestApiId: !Ref RestApi
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['ssm:GetParameter']
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - S3CrudPolicy: { BucketName: !Ref ScrapedContentBucket }
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  AnalyzeJobMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/jd/analyzeJobMatch.handler
      CodeUri: src/
      Environment:
        Variables:
          ANALYSIS_WORKER_LAMBDA: !Ref AnalysisWorkerFunction
      MemorySize: 1024
      # The scrape escalation now shares ONE total ~25s deadline (it no longer
      # restarts a fresh 30s allowance per tier), and JD PDF OCR is deadline-
      # bounded too, so the whole analysis fits inside API Gateway's ~29s
      # integration timeout. Cap the Lambda at 29s to match: raising only the
      # Lambda timeout would not move the gateway deadline (finding 10), it would
      # just keep spending scrape.do/Bedrock credits on a request the client has
      # already seen 504 for.
      Timeout: 29
      Events:
        Api:
          Type: Api
          Properties:
            Path: /jd/analyze
            Method: post
            RestApiId: !Ref RestApi
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['s3:GetObjectVersion']
              Resource: !Sub '${ScrapedContentBucket.Arn}/*'
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['ssm:GetParameter']
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref AnalysisJobsTable }
        - LambdaInvokePolicy: { FunctionName: !Ref AnalysisWorkerFunction }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBReadPolicy: { TableName: !Ref ResumesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel'], Resource: '*' }]
        # JD PDF path: read the uploaded file and run Textract text detection.
        - S3ReadPolicy: { BucketName: !Ref ScrapedContentBucket }
        - Statement: [{ Effect: Allow, Action: ['textract:StartDocumentTextDetection', 'textract:GetDocumentTextDetection'], Resource: '*' }]
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  GenerateJdUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/jd/generateJdUploadUrl.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Events:
        Api:
          Type: Api
          Properties:
            Path: /jd/upload-url
