      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - Statement: [{ Effect: Allow, Action: ['execute-api:ManageConnections'], Resource: '*' }]

  SendTextHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/websocket/sendTextHandler.handler
      CodeUri: src/
      # PERF-FIX #8: on the critical path of every spoken turn (WS -> SQS).
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          ASYNC_QUEUE_URL: !Ref AsyncInterviewQueue
          FEEDBACK_TOPIC_ARN: !Ref FeedbackTriggerTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConceptStatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResumesTable }
        - Statement: [{ Effect: Allow, Action: ['execute-api:ManageConnections'], Resource: '*' }]
        - Statement: [{ Effect: Allow, Action: ['polly:SynthesizeSpeech'], Resource: '*' }]
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream'], Resource: '*' }]
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt FeedbackTriggerTopic.TopicName }
        - S3CrudPolicy: { BucketName: !Ref ScrapedContentBucket }
        - S3CrudPolicy: { BucketName: !Ref AudioBucket }
        - SSMParameterReadPolicy: { ParameterName: qlue/* }
        - Statement: [{ Effect: Allow, Action: ['sqs:SendMessage'], Resource: !GetAtt AsyncInterviewQueue.Arn }]



  StateUpdateHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/websocket/stateUpdateHandler.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - Statement: [{ Effect: Allow, Action: ['execute-api:ManageConnections'], Resource: '*' }]

  ErrorHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/websocket/errorHandler.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - Statement: [{ Effect: Allow, Action: ['execute-api:ManageConnections'], Resource: '*' }]

  # ========= FEEDBACK =========
  # R-05 backstop: a scheduled sweep of the feedback outbox. The PRIMARY recovery
  # for a failed/dropped publish is the racing duplicate terminate; this Lambda
  # only catches jobs whose every terminate path died before the publish was
  # acknowledged. It QUERIES FeedbackDispatchIndex (never scans) for PENDING jobs
  # older than a grace window and re-publishes until acknowledged; downstream
  # stages are idempotent so a duplicate publish is harmless.
  DispatchFeedbackJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FeedbackDLQ.Arn
      Handler: handlers/feedback/dispatchFeedbackJobs.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
          FEEDBACK_RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
          TURN_RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
          FEEDBACK_TOPIC_ARN: !Ref FeedbackTriggerTopic
      Events:
        StreamTrigger:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt SessionsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"feedbackDispatchPending":{"S":["PENDING"]}}}}'
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"feedbackStatus":{"S":["PENDING"]}}}}'
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"currentState":{"S":["INITIALIZING","PROCESSING_RESPONSE","LOADING_CONTEXT"]}}}}'
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"answerAudioCleanupPending":{"BOOL":[true]}}}}'
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"answerAudioLastExpiry":{"N":[{"exists":true}]}}}}'
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt FeedbackDLQ.Arn
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt FeedbackDLQ.QueueName }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:DescribeStream]
              Resource: !GetAtt SessionsTable.StreamArn
            - Effect: Allow
              Action: [dynamodb:ListStreams]
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt FeedbackTriggerTopic.TopicName }

  TriggerFeedbackGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/feedback/triggerFeedbackGeneration.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 15
      # Finding 9: an SNS delivery that exhausts its async retries dead-letters
      # instead of vanishing.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FeedbackDLQ.Arn
      Environment:
        Variables:
          ANALYZE_TRANSCRIPT_LAMBDA: !Ref AnalyzeTranscriptFunction
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref FeedbackTriggerTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConceptStatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - Statement: [{ Effect: Allow, Action: ['polly:SynthesizeSpeech'], Resource: '*' }]
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel'], Resource: '*' }]
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AnalyzeTranscriptFunction.Arn
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  AnalyzeTranscriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/feedback/analyzeTranscript.handler
      CodeUri: src/
      MemorySize: 1024
      Timeout: 60
      # Finding 9: dead-letter an async stage that exhausts its retries.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FeedbackDLQ.Arn
      Environment:
        Variables:
          GENERATE_REPORT_LAMBDA: !Ref GenerateFeedbackReportFunction
      # SECURITY: the feedback pipeline stages are internal, invoked only via
      # SNS -> triggerFeedbackGeneration -> lambda:InvokeFunction. Exposing them
      # as public REST routes let any signed-in caller drive paid Bedrock
      # inference and write feedback rows for arbitrary userIds, with an event
      # shape (raw payload, not an API Gateway event) that skips every
      # ownership check. The Api events have been removed.
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['ssm:GetParameter']
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/qlue/${AWS::StackName}/paid-ops-disabled'
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
              Resource: !GetAtt UsageTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConceptStatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - Statement: [{ Effect: Allow, Action: ['polly:SynthesizeSpeech'], Resource: '*' }]
        - Statement: [{ Effect: Allow, Action: ['bedrock:InvokeModel'], Resource: '*' }]
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt GenerateFeedbackReportFunction.Arn
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  ComputeModuleScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/feedback/computeModuleScores.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 15
      # SECURITY: internal pipeline stage — see AnalyzeTranscriptFunction.
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt SessionsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
