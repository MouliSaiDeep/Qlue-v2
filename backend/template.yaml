    Type: AWS::Serverless::Function
    Properties:
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt ResumeRecoveryDLQ.Arn
      Handler: handlers/resume/recoverResumes.handler
      CodeUri: src/
      Timeout: 60
      Environment:
        Variables:
          RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
          RESUME_WORKER_LAMBDA: !Ref ProcessResumeUploadFunction
      Events:
        StreamTrigger:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ResumesTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
                - Pattern: '{"eventName":["MODIFY"],"dynamodb":{"NewImage":{"status":{"S":["PARSING","FAILED"]}}}}'
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt ResumeRecoveryDLQ.Arn
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt ResumeRecoveryDLQ.QueueName }
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:DescribeStream]
              Resource: !GetAtt ResumesTable.StreamArn
            - Effect: Allow
              Action: [dynamodb:ListStreams]
              Resource: '*'
        - DynamoDBCrudPolicy: { TableName: !Ref ResumesTable }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
            - Effect: Allow
              Action: ['lambda:InvokeFunction']
              Resource: !GetAtt ProcessResumeUploadFunction.Arn
