  LogoutUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/logoutUser.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 10
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/logout
            Method: post
            RestApiId: !Ref RestApi
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        # R-10: logout now deactivates the user's open WebSocket connections
        # (query GSI_UserIdIsActive + conditional UpdateItem) so a revoked
        # credential's socket is cut off immediately, not just blocked from
        # minting new tokens.
        - DynamoDBCrudPolicy:
            TableName: !Ref WSConnectionsTable
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/deleteAccount.handler
      CodeUri: src/
      MemorySize: 512
      Environment:
        Variables:
          RECOVERY_QUEUE_URL: !Ref RecoveryDelayQueue
      # Accept a durable cleanup job and promptly remove Firebase access.
      # The deletion worker handles paginated storage cleanup after the drain.
      Timeout: 60
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/account
            Method: delete
            RestApiId: !Ref RestApi
            # The handler checks a fresh Firebase proof, including for retries
            # after identity removal and for unverified users deleting themselves.
            Auth: { Authorizer: NONE }
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt RecoveryDelayQueue.QueueName }
        - S3CrudPolicy: { BucketName: !Ref AnswerAudioBucket }
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:ConditionCheckItem']
              Resource: !GetAtt DeletionJobsTable.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref DeletionJobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TranscriptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FeedbackTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConceptStatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResumesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WSConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
        - S3CrudPolicy: { BucketName: !Ref ResumesBucket }
        - S3CrudPolicy: { BucketName: !Ref ScrapedContentBucket }
        - S3CrudPolicy: { BucketName: !Ref AudioBucket }
        # SAM S3CrudPolicy does not include version enumeration/deletion.
        - Statement:
            - Effect: Allow
              Action: ['s3:ListBucketVersions']
              Resource: [!GetAtt AnswerAudioBucket.Arn, !GetAtt ResumesBucket.Arn, !GetAtt ScrapedContentBucket.Arn, !GetAtt AudioBucket.Arn]
            - Effect: Allow
              Action: ['s3:DeleteObjectVersion']
              Resource: [!Sub '${AnswerAudioBucket.Arn}/*', !Sub '${ResumesBucket.Arn}/*', !Sub '${ScrapedContentBucket.Arn}/*', !Sub '${AudioBucket.Arn}/*']
        - SSMParameterReadPolicy: { ParameterName: qlue/* }

