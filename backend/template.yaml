  ValidateWebsiteFunction:
    # Validations run as durable jobs; this route only admits work.
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/website/validateWebsite.handler
      CodeUri: src/
      Environment:
        Variables:
          ANALYSIS_WORKER_LAMBDA: !Ref AnalysisWorkerFunction
