name: Verify Flutter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Analyze application and tests
        run: flutter analyze --no-pub
      - name: Run regression tests
        run: flutter test --no-pub --coverage --reporter expanded
      - name: Retain coverage for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
