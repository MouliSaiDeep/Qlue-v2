name: Deploy Qlue Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Jest
        working-directory: backend
        run: npm run test -- --coverage --passWithNoTests

  # Build and deploy in ONE job: the previous split relied on
  # upload-artifact, which silently excludes hidden directories like
  # .aws-sam by default — the deploy job was downloading an empty artifact.
  deploy-dev:
    if: github.event_name == 'push' || inputs.environment == 'dev'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          # Must match samconfig.toml and where the SSM parameters live.
          aws-region: us-east-1
      - name: SAM Build
        working-directory: backend
        run: sam build
      - name: SAM Deploy (dev / default stack)
        working-directory: backend
        # samconfig.toml has [default] and [prod] environments; there is no
        # [dev], so the default environment IS dev (stack qlue-dev).
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

  # Prod deploys are MANUAL ONLY (Actions tab -> Run workflow -> prod).
  # Note: the DynamoDB tables use fixed names, so dev and prod stacks
  # cannot coexist in the same account/region — only run this if the
  # prod stack is the one that owns the tables.
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: us-east-1
      - name: SAM Build
        working-directory: backend
        run: sam build
      - name: SAM Deploy to Prod
        working-directory: backend
        run: sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset

  notify:
    needs: [deploy-dev]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#FF0000'
          SLACK_MESSAGE: 'Qlue Deployment Pipeline Failed! :x:'
          SLACK_TITLE: Build Failure
