name: Verify Backend and Prepare Migration

# Main pushes run checks only. No job in this workflow deploys or assumes an AWS role.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'audit/*.cjs', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['backend/**', 'audit/*.cjs', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Native ARM64 avoids mistaking emulator startup timeouts for target behavior.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Jest
        working-directory: backend
        run: npm test -- --runInBand --coverage --collectCoverageFrom='src/**/*.js'
      - name: Validate feedback evaluation corpus
        working-directory: backend
        run: node evaluation/evaluate.cjs
      - name: Install isolated audio gateway dependencies
        working-directory: backend/audio-gateway
        run: npm ci --ignore-scripts
      - name: Verify disabled-by-default audio gateway
        working-directory: backend/audio-gateway
        run: npm test
      - name: Exercise concurrent synthetic streams across two replicas
        working-directory: backend/audio-gateway
        run: node scripts/load-smoke.mjs --clients=24 --slots=12 --duration-ms=1600
      - name: Audit audio gateway production dependencies
        working-directory: backend/audio-gateway
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit build and test dependencies for high or critical advisories
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit shipped Lambda layer
        working-directory: backend/layers/dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: aws-actions/setup-sam@v2
      - name: Audit delivery layer
        working-directory: backend/layers/delivery
        run: npm audit --omit=dev --audit-level=high
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build and smoke-test disabled audio gateway
        working-directory: backend/audio-gateway
        run: |
          docker build --platform linux/arm64 -t qlue-audio-gateway:ci-review .
          node scripts/container-smoke.mjs --image qlue-audio-gateway:ci-review
      - name: Validate canonical SAM template
        working-directory: backend
        run: sam validate --lint --template-file template.yaml --region us-east-1
      - name: Validate optional audio gateway infrastructure
        working-directory: backend
        run: |
          sam validate --lint --template-file audio-gateway/infrastructure.yaml --region us-east-1
          sam validate --lint --template-file audio-gateway/network.yaml --region us-east-1
      - name: Build actual arm64 deployment artifacts
        working-directory: backend
        run: sam build --use-container --no-cached
      - name: Reject oversized or development-heavy Lambda packages
        run: node audit/verify-lambda-size.cjs
      - name: Verify packaged dependencies
        run: node audit/verify-packaged.cjs
      - name: Test with packaged production dependencies in Linux arm64
        run: docker run --rm --platform linux/arm64 --entrypoint node -v "$PWD:/workspace" -w /workspace/backend public.ecr.aws/lambda/nodejs:24 node_modules/jest/bin/jest.js --runInBand --no-cache --resolver=/workspace/backend/tests/helpers/layerResolver.cjs
      - name: Run Linux arm64 native parser
        run: docker run --rm --platform linux/arm64 --entrypoint node -v "$PWD:/workspace:ro" -w /workspace public.ecr.aws/lambda/nodejs:24 audit/layer-smoke.cjs
      - name: Verify packaged Linux arm64 delivery runtime and model
        run: docker run --rm --platform linux/arm64 --entrypoint node -v "$PWD:/workspace:ro" -w /workspace public.ecr.aws/lambda/nodejs:24 audit/delivery-layer-smoke.cjs

  prepare-migration:
    if: github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
        working-directory: backend
      - uses: aws-actions/setup-sam@v2
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Generate initial application migration with every schedule paused
        run: node audit/prepare-paused-migration.cjs
      - name: Validate paused migration
        working-directory: backend
        run: sam validate --lint --template-file template-migration.yaml --region us-east-1
      - name: Build paused migration for review only
        working-directory: backend
        run: sam build --use-container --no-cached --template-file template-migration.yaml
      - name: Check Lambda extracted package size before upload
        run: node audit/verify-lambda-size.cjs
      - name: Save review artifacts; operator must adopt logs and index first
        uses: actions/upload-artifact@v4
        with:
          name: paused-backend-review-${{ github.sha }}
          include-hidden-files: true
          path: |
            backend/.aws-sam/build
            backend/template-migration.yaml
            audit/backend-rollout-runbook.md
            audit/prepare-log-adoption.cjs
          if-no-files-found: error
