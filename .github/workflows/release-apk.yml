name: Verify and Release Android APK

# Cut a release by pushing a version tag, for example:
#   git tag v1.0.0 && git push origin v1.0.0
# Tags verify, build, and publish a signed APK.
# Everything (release tag, name, notes) is derived from the pushed tag.
on:
  push:
    tags:
      - 'v*'

# Publish releases only after verification succeeds.

permissions:
  contents: read

jobs:
  # Gate: a tag must pass frontend analyze/tests AND backend tests + dependency
  # audit before publishing an APK (users
  # obtain public updates from GitHub Releases), so a red build must never ship.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---- Frontend: static analysis + widget/unit tests ----
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        run: flutter analyze
      - name: Flutter test
        working-directory: frontend
        run: flutter test

      # ---- Backend: unit/integration tests + dependency audit ----
      # The APK talks to this backend; align the Node major with the Lambda
      # runtime (nodejs24.x) so the gate exercises the shipped engine.
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand
      - name: Backend prod dependency audit (fail on high/critical)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Shipped Lambda layer audit (fail on high/critical)
        working-directory: backend/layers/dependencies
        run: npm audit --omit=dev --audit-level=high

  build-release-apk:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # The Flutter project lives in frontend/, not the repo root, so every
        # `run` step executes there. (`uses:` steps below use repo-root paths.)
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the toolchain the app is built/verified with locally
          # (Dart 3.11.0 satisfies pubspec's `sdk: ^3.11.0`). Bump when you
          # upgrade Flutter; drop `flutter-version` to always take latest stable.
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Write google-services.json from secret
        # The Firebase (com.google.gms.google-services) Gradle plugin hard-fails
        # if this file is missing, and it is gitignored, so materialize it from
        # a repository secret (base64 of frontend/android/app/google-services.json).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON is not set. Base64-encode frontend/android/app/google-services.json and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "Wrote android/app/google-services.json"

      - name: Write env.json from secret
        # The app reads its config at COMPILE time via --dart-define-from-file=env.json
        # (see lib/core/env.dart; Env.validate() hard-fails at launch if it is missing).
        # env.json is not committed, so materialize it from a repository secret
        # (base64 of frontend/env.json).
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -z "$ENV_JSON" ]; then
            echo "::error::Repository secret ENV_JSON is not set. Base64-encode frontend/env.json and add it as an Actions secret."
            exit 1
          fi
          printf '%s' "$ENV_JSON" | base64 --decode > env.json
          echo "Wrote env.json"

      - name: Write release keystore from secrets
        # Every published release MUST be signed with the SAME stable upload
        # keystore. If one release is signed with a different key (e.g. the
        # ephemeral CI debug keystore, whose signature changes every run), users
        # can't update in place: Android rejects the install with "App not
        # installed / package appears to be invalid" and they must uninstall
        # first. So a missing keystore is a HARD FAILURE — we never publish a
        # debug-signed APK. Provide ANDROID_KEYSTORE_BASE64 (base64 of
        # frontend/android/upload-keystore.jks) and ANDROID_KEYSTORE_PASSWORD as
        # repository secrets.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets missing. Add ANDROID_KEYSTORE_BASE64 (base64 of frontend/android/upload-keystore.jks) and ANDROID_KEYSTORE_PASSWORD under Settings -> Secrets and variables -> Actions. Publishing a debug-signed APK would break in-place updates for existing users."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=../upload-keystore.jks\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "Wrote android/upload-keystore.jks and android/key.properties"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # Derive BOTH the version name and the versionCode from the pushed tag
        # (v1.0.5 -> build-name 1.0.5). The version name tracks the release so
        # package_info_plus reports it in-app; the versionCode must be an integer
        # that NEVER decreases between releases, or Android blocks the update as a
        # downgrade. github.run_number doesn't track the version (and resets to 1
        # if the workflow is ever recreated), so encode the semver itself as
        # major*10000 + minor*100 + patch (1.0.5 -> 10005), which rises with every
        # release. --dart-define-from-file=env.json injects the compile-time
        # config (resolved relative to frontend/, this job's working-directory).
        # The keystore step above guarantees the stable upload signingConfig.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          VERSION_CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          flutter build apk --release \
            --dart-define-from-file=env.json \
            --dart-define=SPEECH_REVIEW=false \
            --build-name="$VERSION" \
            --build-number="$VERSION_CODE"
          echo "Built app version $VERSION (versionCode $VERSION_CODE)"

      - name: Rename APK to Qlue.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Qlue.apk

      - name: Verify production speech reachability and universal packaging
        run: |
          node ../audit/verify-release-reachability.cjs
          python3 ../audit/verify-release-apk.py build/app/outputs/flutter-apk/Qlue.apk

      - name: Smoke-check built APK
        # Integrity gate before saving the review artifact: the artifact must
        # exist, be a non-trivial valid ZIP (APKs are ZIPs), and contain an
        # AndroidManifest. Catches a truncated/corrupt build before users get it.
        run: |
          APK=build/app/outputs/flutter-apk/Qlue.apk
          test -f "$APK" || { echo "::error::APK missing at $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000 || { echo "::error::APK suspiciously small ($SIZE bytes)"; exit 1; }
          unzip -t "$APK" >/dev/null || { echo "::error::APK is not a valid archive"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "::error::APK missing AndroidManifest.xml"; exit 1; }
          echo "APK smoke check passed"

      - name: Save signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Qlue-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/Qlue.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd ..
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; retaining its published APK."
            exit 0
          fi
          gh release create "$TAG" frontend/build/app/outputs/flutter-apk/Qlue.apk \
            --repo "$REPOSITORY" --verify-tag --title "Qlue ${TAG#v}" \
            --notes-file "releases/${TAG#v}.md" --latest
